version: "0.1"
objects:
  - id: KO-001
    title: "Metacognitive monitoring"
    aliases: ["thinking about thinking", "metakognitív monitorozás"]
    status: stable
    evidence_level: A
    domain: KM-01
    definition: "Saját tudásunk, megértésünk, bizonyosságunk és gondolkodási folyamataink megfigyelése és értékelése."
    claim: "A saját bizonyosság és teljesítmény elkülönített vizsgálata javíthatja a hibák felismerését, de az önértékelés önmagában nem mindig pontos."
    not_evidence_of: ["általános intelligencia", "erkölcsi felsőbbrendűség", "hogy az önértelmezés biztosan helyes"]
    everyday_signals: ["biztos vagyok benne, de nem tudom megmutatni, miből tudom", "nem veszem észre, hol szűnik meg a tudásom"]
    reflection_prompts: ["Mennyire vagy biztos, és milyen megfigyelés változtatná meg ezt a bizonyosságot?"]
    decision_boundary: "Az ASRI kalibrációt kérhet, de nem nyilváníthatja a személy belső értelmezését automatikusan hamisnak."
    source_ids: [SRC-001, SRC-002, SRC-003]
    related_ids: [KO-002, KO-030]
    last_reviewed: "2026-10-10"

  - id: KO-002
    title: "Metacognitive reflection cycle"
    aliases: ["reflexiós ciklus"]
    status: stable
    evidence_level: B
    domain: KM-01
    definition: "Megfigyelés, kérdezés, értelmezés, kipróbálás és újraértékelés ismétlődő folyamata, amely a tapasztalatot tanulási adattá alakítja."
    claim: "A reflexió akkor különíthető el legjobban a repetitív ruminációtól, ha új megkülönböztetést, vizsgálható feltevést, perspektívaváltást vagy későbbi visszacsatolást hoz; az öneltávolított nézőpont átlagosan kis előnyt mutat, de az evidencia bizonytalan."
    not_evidence_of: ["hogy több önvizsgálat mindig jobb", "hogy minden esemény mély rejtett jelentést hordoz"]
    everyday_signals: ["ugyanazt az eseményt ismétlem új adat nélkül", "egy felismerést kipróbálható kérdéssé alakítok"]
    reflection_prompts: ["Mi az az egy megfigyelés, amely a következő hasonló helyzetben ellenőrizhető?"]
    decision_boundary: "A ciklus szerkezetet ad; nem határozza meg, milyen következtetésre vagy választásra kell jutni."
    source_ids: [SRC-002, SRC-051, SRC-052]
    related_ids: [KO-001, KO-032]
    notes: "A stable státusz a folyamat-határra vonatkozik, nem arra, hogy az öneltávolítás mindenkinél vagy minden helyzetben előnyös."
    last_reviewed: "2026-10-17"

  - id: KO-003
    title: "Fact–inference–belief–value separation"
    aliases: ["epistemic layer separation"]
    status: stable
    evidence_level: B
    domain: KM-02
    definition: "Egy állítás besorolása megfigyelhető tényként, következtetésként, hitként vagy értékválasztásként."
    claim: "A kategóriák elkülönítése csökkenti annak kockázatát, hogy egy értelmezést pusztán nyelvi magabiztosság miatt tényként kezeljünk."
    not_evidence_of: ["hogy az értékek értéktelenek", "hogy csak mérhető állítás lehet jelentős"]
    everyday_signals: ["biztosan lenéz engem", "a család fontosabb — tehát ez objektív igazság"]
    reflection_prompts: ["Ebből mi volt közvetlenül megfigyelhető, és mit tettél hozzá értelmezésként?"]
    decision_boundary: "Az ASRI besorolást javasolhat, de a személy értékeit nem minősítheti empirikus hibának."
    source_ids: [SRC-003, SRC-004]
    related_ids: [KO-004, KO-030]
    last_reviewed: "2026-10-10"

  - id: KO-004
    title: "Cognitive bias as a bounded tendency"
    aliases: ["kognitív torzítás"]
    status: stable
    evidence_level: A
    domain: KM-03
    definition: "Rendszeresen megfigyelhető eltérés valamely normatív ítéleti mércétől, meghatározott feladatban vagy környezetben."
    claim: "A torzítások valószínűségi tendenciák, nem személyiségdiagnózisok; jelenlétük csak konkrét döntési folyamatból következtethető."
    not_evidence_of: ["butaság", "rosszindulat", "hogy minden gyors ítélet hibás"]
    everyday_signals: ["egy általános bias-címkével lezárom a vitát", "csak a másik ember torzítását keresem"]
    reflection_prompts: ["Milyen konkrét ítéleti lépésben jelenhetett meg torzítás, és mi az alternatív magyarázat?"]
    decision_boundary: "Bias-címke nem használható a másik fél álláspontjának bizonyítás nélküli érvénytelenítésére."
    source_ids: [SRC-004, SRC-005]
    related_ids: [KO-005, KO-006]
    last_reviewed: "2026-10-10"

  - id: KO-005
    title: "Confirmation bias"
    aliases: ["megerősítési torzítás"]
    status: stable
    evidence_level: A
    domain: KM-03
    definition: "A meglévő feltevést támogató információ keresésének, értelmezésének vagy felidézésének aránytalan előnye."
    claim: "A saját álláspont ellen szóló bizonyíték előzetes megnevezése segíthet láthatóvá tenni a szelektív bizonyítékkezelést."
    not_evidence_of: ["hogy a meglévő álláspont hamis", "hogy az ellenkező álláspont igaz"]
    everyday_signals: ["csak támogató példákat gyűjtök", "az ellenpéldát kivételnek, a támogató példát bizonyítéknak nevezem"]
    reflection_prompts: ["Mi lenne a legerősebb adat a jelenlegi álláspontod ellen?"]
    decision_boundary: "Az ASRI az információkezelést vizsgálja, nem kényszeríti a felhasználót véleménye megváltoztatására."
    source_ids: [SRC-005, SRC-046]
    related_ids: [KO-006, KO-030]
    last_reviewed: "2026-10-10"

  - id: KO-006
    title: "Motivated reasoning"
    aliases: ["motivált érvelés"]
    status: stable
    evidence_level: B
    domain: KM-03
    definition: "Olyan következtetési folyamat, amelyben egy kívánt eredmény befolyásolja az információ keresését és értékelését, miközben az érvelés racionálisnak tűnhet."
    claim: "A motiváció nem teszi automatikusan hamissá a következtetést, de indokolja az evidencia szimmetrikusabb ellenőrzését."
    not_evidence_of: ["tudatos hazugság", "hogy az érzelem mindig megrontja a gondolkodást"]
    everyday_signals: ["ugyanazt a bizonyítékot más mércével mérem, ha nekem kedvez", "az indokaim a döntés után jelennek meg"]
    reflection_prompts: ["Ugyanezt a bizonyítékot mennyire találnád erősnek, ha az ellenkező eredményt támogatná?"]
    decision_boundary: "Az ASRI motivációs hipotézist csak kérdésként vethet fel; rejtett szándékot nem állíthat tényként."
    source_ids: [SRC-006, SRC-046]
    related_ids: [KO-005, KO-007]
    last_reviewed: "2026-10-10"

  - id: KO-007
    title: "Cognitive dissonance and rationalization"
    aliases: ["kognitív disszonancia", "racionalizáció"]
    status: stable
    evidence_level: B
    domain: KM-03
    definition: "Feszültség egymással össze nem illő meggyőződések, önkép és cselekedet között; racionalizáció az utólagos összeegyeztetés egyik lehetséges módja."
    claim: "Az indokok időzítésének vizsgálata segíthet elkülöníteni az előzetes döntési okot az utólagos önigazolástól."
    not_evidence_of: ["képmutató személyiség", "hogy minden utólagos magyarázat hamis"]
    everyday_signals: ["a döntés után új okokat találok", "a viselkedésemhez igazítom korábbi álláspontom emlékét"]
    reflection_prompts: ["Ezt az indokot a döntés előtt is meg tudtad volna nevezni?"]
    decision_boundary: "A rendszer jelezhet időbeli eltérést, de nem nyilváníthatja a személy indokát automatikusan kifogásnak."
    source_ids: [SRC-007, SRC-008]
    related_ids: [KO-006, KO-010]
    last_reviewed: "2026-10-10"

  - id: KO-008
    title: "Reconstructive memory"
    aliases: ["rekonstruktív emlékezet"]
    status: stable
    evidence_level: A
    domain: KM-03
    definition: "Az emlékezés aktív rekonstrukció: a felidézés nem változatlan felvétel lejátszása, és utólagos információ is alakíthatja."
    claim: "Az élénkség és őszinte bizonyosság nem garantálja az emlék részleteinek pontosságát."
    not_evidence_of: ["hogy az emlék hamis", "hogy a személy hazudik", "hogy minden múltbeli beszámoló használhatatlan"]
    everyday_signals: ["nagyon élénken emlékszem, tehát pontos", "későbbi információt az eredeti esemény részeként idézek fel"]
    reflection_prompts: ["Mi az, amit már az eseménykor rögzítettél, és mi az, amit később tudtál meg?"]
    decision_boundary: "Az ASRI nem dönthet vitatott történeti tényről pusztán az emlékezet általános esendőségére hivatkozva."
    source_ids: [SRC-010, SRC-011]
    related_ids: [KO-009, KO-003]
    last_reviewed: "2026-10-10"

  - id: KO-009
    title: "Source monitoring"
    aliases: ["forrásmonitorozás"]
    status: stable
    evidence_level: B
    domain: KM-02
    definition: "Annak megítélése, hogy egy emlék, állítás vagy képzet milyen forrásból származik: észlelésből, más személytől, következtetésből vagy elképzelésből."
    claim: "A forrás explicit visszakeresése csökkentheti a tartalom és eredet automatikus összemosását."
    not_evidence_of: ["hogy forrás nélkül az állítás hamis", "szándékos megtévesztés"]
    everyday_signals: ["tudom, de nem emlékszem, honnan", "saját következtetésemet később hallott tényként kezelem"]
    reflection_prompts: ["Mi a legkorábbi azonosítható forrása ennek az állításnak?"]
    decision_boundary: "A rendszer kérheti a forrás megjelölését, de a hiányát nem használhatja automatikus cáfolatként."
    source_ids: [SRC-009, SRC-010]
    related_ids: [KO-008, KO-003]
    last_reviewed: "2026-10-10"

  - id: KO-010
    title: "Emotional awareness and differentiation"
    aliases: ["érzelmi tudatosság", "emotion differentiation"]
    status: stable
    evidence_level: B
    domain: KM-04
    definition: "Az aktuális érzelmi állapot és annak árnyalatainak felismerése, megnevezése és elkülönítése a hozzá kapcsolódó gondolattól."
    claim: "A pontosabb érzelmi megkülönböztetés több adatforrásban együtt jár jobb alkalmazkodással, de a hatás mértéke, iránya és mérési módja változó; a címkézés önmagában nem bizonyított általános beavatkozás."
    not_evidence_of: ["hogy az érzés oka ismert", "hogy a megnevezés önmagában megoldja a helyzetet"]
    everyday_signals: ["csak azt tudom, hogy rossz", "az érzést és az eseményről alkotott ítéletet ugyanannak veszem"]
    reflection_prompts: ["Mi az érzés neve, mi a testi jel, és mi az ehhez kapcsolt történet?"]
    decision_boundary: "Az ASRI kínálhat szókincset, de nem közölheti kívülről, mit érez valójában a személy."
    source_ids: [SRC-012, SRC-053, SRC-054]
    related_ids: [KO-011, KO-012]
    notes: "A konstrukció használható, de az ASRI nem következtet mentális állapotra pusztán szöveges érzelemszókincsből."
    last_reviewed: "2026-10-17"

  - id: KO-011
    title: "Emotion as data, not proof"
    aliases: ["érzelem mint adat"]
    status: stable
    evidence_level: B
    domain: KM-04
    definition: "Az érzelem jelzi, hogyan értékeljük és éljük meg a helyzetet, de önmagában nem bizonyítja a külső eseményre vonatkozó állítás igazságát."
    claim: "Az érzelmet és a tényállítást külön vizsgálva az élmény komolyan vehető anélkül, hogy automatikus bizonyítékká válna."
    not_evidence_of: ["hogy az érzelem irracionális", "hogy az érzelmet figyelmen kívül kell hagyni"]
    everyday_signals: ["félek, tehát biztosan veszélyes", "megkönnyebbültem, tehát jó döntés volt"]
    reflection_prompts: ["Mit jelez az érzés a te értékelésedről, és milyen külön adat szól a külső állítás mellett?"]
    decision_boundary: "Az ASRI nem érvénytelenítheti az élményt, és nem teheti az érzelmi intenzitást igazságmércévé."
    source_ids: [SRC-012, SRC-041]
    related_ids: [KO-003, KO-010]
    last_reviewed: "2026-10-10"

  - id: KO-012
    title: "Emotion regulation as process"
    aliases: ["érzelemszabályozás"]
    status: stable
    evidence_level: A
    domain: KM-04
    definition: "Az érzelmi folyamat különböző pontjain végzett változtatás: helyzet, figyelem, értelmezés vagy válasz módosítása."
    claim: "Nincs minden helyzetben univerzálisan legjobb stratégia; a cél, időzítés, költség és kontextus számít."
    not_evidence_of: ["érzelemelnyomás", "állandó nyugalom", "hogy a kellemetlen érzés szabályozási kudarc"]
    everyday_signals: ["csak akkor avatkozom be, amikor már elárasztott az érzés", "egy stratégiát minden helyzetben alkalmazok"]
    reflection_prompts: ["A folyamat melyik pontján van most tényleges mozgástered: helyzet, figyelem, értelmezés vagy válasz?"]
    decision_boundary: "Az ASRI bemutathat stratégiákat és következményeket; nem írhatja elő, melyik érzést kell eltüntetni."
    source_ids: [SRC-013, SRC-014, SRC-015]
    related_ids: [KO-010, KO-013]
    last_reviewed: "2026-10-10"

  - id: KO-013
    title: "Impulse–response–choice distinction"
    aliases: ["impulzus és választás elkülönítése"]
    status: stable
    evidence_level: B
    domain: KM-05
    definition: "A késztetés, a végrehajtott reakció és a tudatosan vállalt választás három elkülöníthető mozzanata."
    claim: "Egy impulzus jelenléte nem azonos annak végrehajtásával; a késleltetés és előre kialakított válasz növelheti a gyakorlati választási teret."
    not_evidence_of: ["korlátlan önkontroll", "hogy minden helyzetben volt reális alternatíva"]
    everyday_signals: ["ezt éreztem, tehát meg kellett tennem", "csak utólag nevezem döntésnek az automatikus reakciót"]
    reflection_prompts: ["Mi volt a késztetés, mi lett a cselekedet, és hol volt köztük akár egy kis választási pont?"]
    decision_boundary: "A rendszer nem tételezhet teljes döntési kapacitást kényszer, akut veszély vagy beszűkült állapot esetén."
    source_ids: [SRC-014, SRC-049, SRC-050]
    related_ids: [KO-012, KO-014]
    last_reviewed: "2026-10-10"

  - id: KO-014
    title: "Habit and automaticity"
    aliases: ["szokás", "automatikusság"]
    status: stable
    evidence_level: A
    domain: KM-05
    definition: "Ismételt viselkedés és stabil jelzők kapcsolatából kialakuló, csökkent tudatos kontrollal induló válasz."
    claim: "A szokás megváltoztatásában gyakran hatékonyabb a kiváltó környezet és az alternatív válasz módosítása, mint a puszta szándék ismétlése."
    not_evidence_of: ["megváltoztathatatlan személyiség", "felelősség teljes hiánya"]
    everyday_signals: ["észrevétlenül ugyanazt teszem ugyanabban a helyzetben", "erős szándék mellett is visszatérek a rutinba"]
    reflection_prompts: ["Melyik konkrét jel indítja a rutint, és milyen más válasz készíthető elő ugyanarra a jelre?"]
    decision_boundary: "Az ASRI a környezet és rutin vizsgálatát segíti; a személy választja meg, akar-e változtatni."
    source_ids: [SRC-016, SRC-017]
    related_ids: [KO-013, KO-032]
    last_reviewed: "2026-10-10"

  - id: KO-015
    title: "Agency"
    aliases: ["cselekvő szerzőség", "ágencia"]
    status: stable
    evidence_level: B
    domain: KM-05
    definition: "Az ember képessége arra, hogy szándékot alkosson, cselekedjen, hatását megfigyelje és saját szerepét felismerje."
    claim: "Az agency nem azonos a teljes kontrollal: a korlátozott helyzetben fennmaradó választási és cselekvési pontokat jelöli."
    not_evidence_of: ["hogy minden rajtam múlik", "hogy a strukturális korlátok jelentéktelenek"]
    everyday_signals: ["vagy teljes kontrollom van, vagy semmi", "a körülmény magyarázatát a saját szerepem eltüntetésére használom"]
    reflection_prompts: ["Mi nem állt irányításod alatt, és mi volt az a legkisebb rész, amelyben mégis te cselekedtél?"]
    decision_boundary: "Az ASRI nem alakíthatja az agency fogalmát áldozathibáztatássá vagy korlátlan felelősség állításává."
    source_ids: [SRC-018, SRC-019]
    related_ids: [KO-016, KO-017]
    last_reviewed: "2026-10-10"

  - id: KO-016
    title: "Self-efficacy is not agency"
    aliases: ["önhatékonyság"]
    status: stable
    evidence_level: B
    domain: KM-05
    definition: "Önhatékonyság: az adott feladat végrehajtására vonatkozó képességhit; nem maga a választás, képesség vagy erkölcsi felelősség."
    claim: "A magasabb önhatékonyság támogathat kitartást, de lehet tévesen kalibrált, és nem garantál eredményt."
    not_evidence_of: ["tényleges kompetencia", "helyes cél", "korlátlan agency"]
    everyday_signals: ["nem hiszem, hogy képes vagyok rá, tehát nincs választásom", "biztos vagyok benne, tehát sikerülni fog"]
    reflection_prompts: ["A képességedről, a valószínű eredményről vagy a választási szándékodról beszélsz?"]
    decision_boundary: "A rendszer segíthet szétválasztani a hitet és képességet, de nem erőltethet optimista önképet."
    source_ids: [SRC-018, SRC-019]
    related_ids: [KO-001, KO-015]
    last_reviewed: "2026-10-10"

  - id: KO-017
    title: "Attribution and responsibility"
    aliases: ["attribúció", "oksági tulajdonítás"]
    status: stable
    evidence_level: B
    domain: KM-05
    definition: "Annak magyarázata, hogy egy viselkedést vagy eredményt személyes, helyzeti vagy kölcsönhatási oknak tulajdonítunk."
    claim: "Az oksági magyarázat és a felelősség normatív megítélése külön kérdés; egyik nem következik automatikusan a másikból."
    not_evidence_of: ["bűnösség", "felmentés", "hogy egyetlen ok teljes magyarázat"]
    everyday_signals: ["a körülmény okozta, tehát nem döntöttem", "ő ilyen ember, ezért történt"]
    reflection_prompts: ["Mi magyarázza a helyzetet, és ettől külön hol volt tényleges választási lehetőség?"]
    decision_boundary: "Az ASRI nem hozhat jogi vagy erkölcsi ítéletet, és nem egyszerűsítheti a komplex okokat egy címkére."
    source_ids: [SRC-022, SRC-023]
    related_ids: [KO-015, KO-018]
    last_reviewed: "2026-10-10"

  - id: KO-018
    title: "Locus of control and illusion of control"
    aliases: ["kontrollhely", "kontrollillúzió"]
    status: draft
    evidence_level: C
    domain: KM-05
    definition: "A kontrollhely általános elvárás arról, hogy az eredmények mennyiben kapcsolódnak saját cselekvéshez; a kontrollillúzió a ténylegesnél nagyobb befolyás érzete."
    claim: "A belső kontroll nem minden helyzetben előnyös; pontosabb cél a ténylegesen kontrollálható és nem kontrollálható elemek kalibrálása."
    not_evidence_of: ["stabil személyiségtípus", "hogy a belső attribúció mindig érettebb"]
    everyday_signals: ["ha eléggé akarom, biztosan irányíthatom", "semmi közöm az eredményhez"]
    reflection_prompts: ["Melyik elemre van mérhető ráhatásod, melyikre nincs, és melyik bizonytalan?"]
    decision_boundary: "Az ASRI nem taníthat totális személyes kontrollt, és nem használhatja a fogalmat strukturális korlátok tagadására."
    source_ids: [SRC-047, SRC-048, SRC-055]
    related_ids: [KO-015, KO-017]
    notes: "A kultúra moderálhatja az észlelt kontroll és pszichológiai tünetek kapcsolatát; egyéni személyre nem vihető át régiószintű átlag."
    last_reviewed: "2026-10-17"

  - id: KO-019
    title: "Autonomous versus controlled motivation"
    aliases: ["autonóm motiváció", "kontrollált motiváció"]
    status: stable
    evidence_level: A
    domain: KM-05
    definition: "Autonóm a motiváció, ha a személy akarati egyetértéssel cselekszik; kontrollált, ha külső vagy belső nyomás dominál."
